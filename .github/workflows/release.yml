name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.ref_name, '+') && !contains(github.ref_name, '-')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Verify tag matches package and manifest versions
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must follow vMAJOR.MINOR.PATCH (got: $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./addon/manifest.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Version mismatch: tag=$TAG_VERSION package.json=$PKG_VERSION manifest.json=$MANIFEST_VERSION" >&2
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build XPI package
        run: npm run build

      - name: Verify release assets
        run: |
          test -f "dist/zotero-canvas-chat-${VERSION}.xpi"
          test -f "dist/updates.json"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/zotero-canvas-chat-${VERSION}.xpi" \
            "dist/updates.json" \
            --title "Canvas Chat ${GITHUB_REF_NAME}" \
            --generate-notes \
            --latest
